name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Trusted Publishing
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
      - uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3  # v5.2.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - name: Validate before publishing
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest
          python -m ruff check pymobile
          python -m mypy pymobile
          python -m pymobile.compiler.rebuild_dex --check
      - run: python -m build
      # Never push an artifact whose metadata PyPI would reject anyway.
      - run: python -m twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          # A version can be published by hand before the release is cut; do
          # not fail the workflow over files that are already on PyPI.
          skip-existing: true
