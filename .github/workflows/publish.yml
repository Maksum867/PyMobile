name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Trusted Publishing
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - name: Validate before publishing
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest
          python -m ruff check pymobile
          python -m mypy pymobile
          python -m pymobile.compiler.rebuild_dex --check
      - run: python -m build
      # Never push an artifact whose metadata PyPI would reject anyway.
      - run: python -m twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version can be published by hand before the release is cut; do
          # not fail the workflow over files that are already on PyPI.
          skip-existing: true
