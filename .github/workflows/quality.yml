name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: python -m pymobile.compiler.rebuild_dex --check
      - run: ruff check pymobile
      # Tests intentionally use concise untyped pytest fixtures; production
      # package code is held to the strict configuration.
      - run: mypy pymobile --exclude 'pymobile/tests'

  windows:
    name: Windows Python 3.14 (venv)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m venv .windows-venv
      - run: .\.windows-venv\Scripts\python.exe -m pip install -e ".[dev]"
      - run: .\.windows-venv\Scripts\python.exe -m pytest
      - run: .\.windows-venv\Scripts\python.exe -m pymobile.compiler.rebuild_dex --check

  # The next interpreter, separately: actions/setup-python has no stable alias
  # for a pre-release, and it is allowed to fail without hiding a failure on a
  # supported version. 3.16 was checked by hand against 3.16.0a1 (the whole
  # suite, ruff and mypy are clean); this job keeps the framework honest as the
  # alphas land, and the matrix above keeps the promise for released versions.
  pre-release:
    name: Python ${{ matrix.python }} (pre-release, allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          check-latest: true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: python -m pymobile.compiler.rebuild_dex --check
      - run: ruff check pymobile
      - run: mypy pymobile --exclude 'pymobile/tests'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      # tools/ is gitignored, so this step is skipped unless it is present.
      - if: hashFiles('tools/release_audit.py') != ''
        run: python tools/release_audit.py dist --output release-audit.json
      - name: Upload package audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: package-audit-py${{ matrix.python }}
          path: |
            dist/*
            release-audit.json



      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-device-smoke-diagnostics
          path: |
            device-logcat.txt
            device-logcat-full.txt
          if-no-files-found: warn

  android-build:
    # C6: nothing used to build for Android in CI, so a change to the Java
    # renderer, the manifest or the resource pipeline was only noticed by
    # whoever ran `build --native` by hand. This produces a real signed APK and
    # a real `.aab` on every push, and validates the bundle with bundletool.
    name: Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install the package and the Android SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pymobile setup-sdk
          # bundletool is what proves an .aab is uploadable; validate is not
          # something the ZIP layout can stand in for.
          curl -sSLo "$HOME/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          echo "PYMOBILE_BUNDLETOOL=$HOME/bundletool.jar" >> "$GITHUB_ENV"
      - name: Build an app with the Java renderer
        run: |
          python -m pymobile init --name CiApp -t list /tmp/ci-app
          cd /tmp/ci-app
          python -m pymobile check
          python -m pymobile build --native --bundle --verbose
          # The artifact name comes from the project name (`CiApp` -> ciapp),
          # so glob it instead of guessing: a hard-coded name broke this job
          # while the build itself had succeeded.
          ls -l apk/
          python -m pymobile size apk/*.apk
      - name: The APK must declare the level Play requires
        run: |
          cd /tmp/ci-app
          java -jar "$PYMOBILE_BUNDLETOOL" dump manifest --bundle apk/*.aab \
            | tee manifest.txt
          grep -q 'targetSdkVersion="36"' manifest.txt
          grep -q 'supportsRtl="true"' manifest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-artifacts
          path: |
            /tmp/ci-app/apk/*.apk
            /tmp/ci-app/apk/*.aab
          if-no-files-found: error
