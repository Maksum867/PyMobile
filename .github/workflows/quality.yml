name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: python -m pymobile.compiler.rebuild_dex --check
      - run: ruff check pymobile
      # Tests intentionally use concise untyped pytest fixtures; production
      # package code is held to the strict configuration.
      - run: mypy pymobile --exclude 'pymobile/tests'

  windows:
    name: Windows Python 3.14 (venv)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m venv .windows-venv
      - run: .\.windows-venv\Scripts\python.exe -m pip install -e ".[dev]"
      - run: .\.windows-venv\Scripts\python.exe -m pytest
      - run: .\.windows-venv\Scripts\python.exe -m pymobile.compiler.rebuild_dex --check

  # The next interpreter, separately: actions/setup-python has no stable alias
  # for a pre-release, and it is allowed to fail without hiding a failure on a
  # supported version. 3.16 was checked by hand against 3.16.0a1 (the whole
  # suite, ruff and mypy are clean); this job keeps the framework honest as the
  # alphas land, and the matrix above keeps the promise for released versions.
  pre-release:
    name: Python ${{ matrix.python }} (pre-release, allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          check-latest: true
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: python -m pymobile.compiler.rebuild_dex --check
      - run: ruff check pymobile
      - run: mypy pymobile --exclude 'pymobile/tests'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      # tools/ is gitignored, so this step is skipped unless it is present.
      - if: hashFiles('tools/release_audit.py') != ''
        run: python tools/release_audit.py dist --output release-audit.json
      - name: Upload package audit
        uses: actions/upload-artifact@v4
        with:
          name: package-audit-py${{ matrix.python }}
          path: |
            dist/*
            release-audit.json



      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-smoke-diagnostics
          path: |
            device-logcat.txt
            device-logcat-full.txt
            examples/device-smoke/build/*.apk
          if-no-files-found: warn
