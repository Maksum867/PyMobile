[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymobile-framework"
version = "0.9.5"
description = "A small, fast and extensible Python framework for building Android applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maksym Khlystun", email = "m02956682@gmail.com" }]
keywords = ["android", "apk", "mobile", "framework", "ui", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]

# The runtime core deliberately depends on the standard library only: every
# extra dependency costs APK size and build time. certifi is the one exception
# — Android ships no OpenSSL cert file, so a CA bundle must be packaged or
# every HTTPS request fails. It is a build-time input, not shipped as code.
# tomli is only pulled in on Python 3.10, which predates stdlib tomllib.
dependencies = [
    "certifi>=2024.2.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
icons = ["Pillow>=10.0"]
android = ["pyjnius>=1.6"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.4",
    "build>=1.2",
    "twine>=5.0",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/Maksum867/PyMobile"
Documentation = "https://github.com/Maksum867/PyMobile/blob/main/README.md"
Source = "https://github.com/Maksum867/PyMobile/tree/main/pymobile"
Changelog = "https://github.com/Maksum867/PyMobile/blob/main/CHANGELOG.md"
Issues = "https://github.com/Maksum867/PyMobile/issues"

[project.scripts]
pymobile = "pymobile.cli:main"

# The testing fixtures (pymobile_session, pymobile_driver, pymobile_snapshot …)
# are active in every pytest run once pymobile is installed. The entry point is
# named after its module on purpose: `-p pymobile.testing.plugin` or a
# `pytest_plugins` line then names the very same plugin instead of registering
# it twice.
[project.entry-points.pytest11]
"pymobile.testing.plugin" = "pymobile.testing.plugin"

# MANIFEST.in widens the sdist, and setuptools would otherwise copy anything it
# lists that sits inside a package into the wheel as package data - the tests
# included. Package data is declared explicitly below instead.
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pymobile*"]
exclude = ["pymobile.tests*", "pymobile.resources.__pycache__*"]

[tool.setuptools.package-data]
pymobile = [
    "py.typed",
    "resources/*",
    "resources/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "**/__pycache__/*", "*.py[cod]", "*.bak"]

[tool.pytest.ini_options]
testpaths = ["pymobile/tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # __all__ and __slots__ are grouped by meaning, not alphabetically:
    # readers look for "the UI exports", not for the letter L.
    "RUF022",
    "RUF023",
]

[tool.ruff.lint.per-file-ignores]
# B018: attribute access is the assertion under test. RUF001: Ukrainian sample text
# (translations, localised validator messages) is what several tests are about.
"pymobile/tests/*" = ["B018", "RUF001"]
# Cyrillic letters in the transliteration table are the point of the file.
"pymobile/compiler/scaffold.py" = ["RUF001"]
# Month names, currency symbols and separators of real locales.
"pymobile/core/formatting.py" = ["RUF001", "RUF002"]
"pymobile/tests/test_features_080.py" = ["B018", "RUF001"]
# Embedded browser JavaScript/HTML and typographic symbols of the preview renderers.
"pymobile/core/ui/extras_preview.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
# Pytest tests intentionally prioritise readable fixtures; package code is
# checked strictly. Test correctness is covered by pytest in the CI workflow.
exclude = '^pymobile/tests/'